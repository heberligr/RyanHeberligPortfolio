<!DOCTYPE html>

<body data-page="resume">

  <!-- NAV BAR (identical on every page) -->
  <header class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">Ryan Heberlig</a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">MENU</button>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html" data-page="home">Home</a></li>
          <li><a href="projects.html" data-page="projects">Projects</a></li>
          <li><a href="resume.html" data-page="resume" class="nav-cta">Résumé</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- =========================================================
       RÉSUMÉ HEADER
       Download / open buttons for the actual PDF (resume.pdf,
       sitting in the repo root next to this file — swap that file
       out any time you update your resume, no need to touch this
       HTML).
       ========================================================= -->
  <section class="hero hero--compact">
    <div class="container">
      <h1>Résumé</h1>
      <div class="hero-actions">
        <a href="resume.pdf" class="btn btn-primary" download="Ryan-Heberlig-Resume.pdf">Download PDF</a>
        <a href="resume.pdf" class="btn btn-on-dark" target="_blank" rel="noopener">Open in new tab</a>
      </div>
    </div>
  </section>

  <!-- =========================================================
       PDF VIEWER
       Embeds resume.pdf directly. Phone browsers can't display a
       PDF inside a page, so on small screens this whole section is
       hidden and the header buttons above do the job instead
       (style.css section 18).
       ========================================================= -->
  <section class="section section--alt resume-viewer-section">
    <div class="container">
      <div class="resume-viewer">
        <iframe src="resume.pdf#view=FitH&amp;navpanes=0" title="Ryan Heberlig résumé (PDF)"></iframe>
      </div>
    </div>
  </section>

  <!-- TITLE-BLOCK FOOTER -->

    <div class="container">

    </div>
